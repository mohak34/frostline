[project]
name = "salina-pipeline"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.9",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "ty>=0.0.91",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
